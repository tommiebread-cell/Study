<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="A study vault for dynamic panel estimation — a daily planner, a Pomodoro timer, and twenty-six linked notes on Nickell bias, Difference and System GMM, with a live simulation lab.">
<title>Dynamic Panel Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..600&family=Plus+Jakarta+Sans:ital,wght@0,400..600;1,400..500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
<div class="app">
  <nav class="ribbon" aria-label="Vault actions">
    <button class="rb" id="ribbonNav" data-icon="panel-left" title="Toggle the note list" aria-label="Toggle the note list"></button>
    <button class="rb" id="ribbonPalette" data-icon="search" title="Quick switcher (Ctrl+P)" aria-label="Quick switcher"></button>
    <button class="rb" id="ribbonGraph" data-icon="network" title="Graph view (Ctrl+G)" aria-label="Graph view"></button>
    <button class="rb" id="ribbonHome" data-icon="house" title="Back to Today" aria-label="Back to Today"></button>
    <button class="rb bot" id="sidebarToggle" data-icon="panel-right" title="Toggle the note panel" aria-label="Toggle the note panel"></button>
  </nav>

  <aside class="side left" aria-label="Note list">
    <div class="sh">Vault<button class="x" id="navClose" data-icon="x" title="Close" aria-label="Close the note list"></button></div>
    <div class="srch" data-icon="search">
      <input id="filter" type="search" placeholder="Filter notes" aria-label="Filter notes">
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <main class="main">
    <div class="tabs" id="tabs" role="tablist" aria-label="Open notes"></div>
    <div id="panes"></div>
  </main>

  <aside class="side right" aria-label="Current note">
    <div class="sh">Note</div>
    <section class="sblock"><h2>Outline</h2><ul class="ol" id="outline"></ul></section>
    <section class="sblock"><h2>Local graph</h2>
      <canvas id="localGraph" aria-label="Graph of notes linked to this one"></canvas>
    </section>
    <section class="sblock"><h2>Backlinks</h2><div id="backlinks"></div></section>
    <section class="sblock"><h2>Links from here</h2><div id="outlinks"></div></section>
  </aside>

  <div class="status">
    <span id="statusNotes"></span><span id="statusRead"></span><span id="statusSession"></span>
    <span class="sp"><button id="statusPalette">Ctrl+P for commands</button></span>
  </div>
</div>

<div class="ov" id="paletteOverlay" aria-hidden="true">
  <div class="pal" role="dialog" aria-modal="true" aria-label="Quick switcher">
    <input id="paletteInput" type="text" placeholder="Find a note, or type &gt; for commands"
           aria-label="Find a note" autocomplete="off" role="combobox"
           aria-expanded="true" aria-controls="paletteList">
    <ul id="paletteList" role="listbox" aria-label="Results"></ul>
  </div>
</div>

<div class="ov" id="graphOverlay" aria-hidden="true">
  <div class="gwrap" role="dialog" aria-modal="true" aria-label="Graph view">
    <div class="gh">
      <b>Graph</b>
      <span id="graphLegend"></span>
      <button class="btn push" id="graphClose">Close</button>
    </div>
    <canvas id="graphCanvas"></canvas>
  </div>
</div>

<div class="peek" id="peek" role="tooltip"></div>

<noscript>
  <p class="noscript">This vault is an interactive study tool — the planner, the timer, the notes
  and the simulation lab are all built in the browser, so it needs JavaScript enabled.</p>
</noscript>

<script type="module" src="src/js/main.js"></script>
</body>
</html>
